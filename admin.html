```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }

        .admin-box {
            width: 350px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .admin-box h1 {
            margin-bottom: 25px;
            color: #ff4f81;
        }

        .admin-box input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .admin-box input:focus {
            border-color: #ff4f81;
        }

        .admin-box button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff4f81;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .admin-box button:hover {
            background: #ff2f68;
        }

        #adminMessage {
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="admin-box">

        <h1>🔐 Admin Login</h1>

        <input
            type="text"
            id="adminUsername"
            placeholder="Admin Username"
            autocomplete="username"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Admin Password"
            autocomplete="current-password"
        >

        <button onclick="adminLogin()">
            LOGIN
        </button>

        <p id="adminMessage"></p>

    </div>

    <script>
        async function adminLogin() {

            const username =
                document.getElementById("adminUsername").value.trim();

            const password =
                document.getElementById("adminPassword").value;

            const message =
                document.getElementById("adminMessage");

            if (!username || !password) {
                message.style.color = "red";
                message.textContent =
                    "Please enter username and password";
                return;
            }

            try {

                const response = await fetch("/api/admin-login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {

                    message.style.color = "green";
                    message.textContent =
                        "Admin login successful ❤️";

                    setTimeout(() => {
                        window.location.href =
                            "/admin-dashboard.html";
                    }, 1000);

                } else {

                    message.style.color = "red";
                    message.textContent =
                        data.message ||
                        "Incorrect username or password";
                }

            } catch (error) {

                console.error(error);

                message.style.color = "red";
                message.textContent =
                    "Server connection failed";
            }
        }
    </script>

</body>
</html>
